<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Road Rash - Sega Genesis 16-Bit Classic</title>
    <meta name="description" content="Authentic 1991 Sega Genesis Road Rash arcade combat motorcycle racing game rebuilt in TypeScript and Vite with pseudo-3D curve/hill raster road projection, 14 AI rivals, bike shop, police pursuits, and high-speed vehicular combat." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        background-color: #0b0b10;
        color: #e0e0e0;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 1280px;
        max-height: 896px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 68, 0, 0.2);
      }
      canvas#gameCanvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background-color: #000;
      }
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas" width="640" height="448"></canvas>
      <div id="ui-overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
